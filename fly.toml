# Fly.io config. Deploy with: fly launch --copy-config --no-deploy && fly deploy
# Rooms live in memory, so run exactly ONE machine (fly scale count 1).
app = "wordparty"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # Comma-separated list of allowed web origins, e.g. "https://jiezi.party"
  # CORS_ORIGIN = "https://jiezi.party"

[http_service]
  internal_port = 8080
  force_https = true
  # Stopping the machine would drop every live room.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "2s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
